# =============================================================================
# wisepen-common 共享配置（prod profile）
# -----------------------------------------------------------------------------
# 由所有 wisepen-cloud (仅适用于此项目) 子服务通过 shared-configs 引用
# =============================================================================
spring:
  data:
    redis:
      host: ${WISEPEN_REDIS_HOST:${WISEPEN_INFRA_HOST:localhost}}
      port: ${WISEPEN_REDIS_PORT:6379}
      password: ${WISEPEN_REDIS_PASSWORD:root}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 2000ms
  kafka:
    bootstrap-servers: ${WISEPEN_KAFKA_HOST:${WISEPEN_INFRA_HOST:localhost}}:${WISEPEN_KAFKA_PORT:9094}
    producer:
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      auto-offset-reset: earliest
      # prod 用 ErrorHandlingDeserializer 包裹，单条反序列化失败不会拖死整个分区消费
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"

springdoc:
  api-docs.enabled: false
  swagger-ui.enabled: false
