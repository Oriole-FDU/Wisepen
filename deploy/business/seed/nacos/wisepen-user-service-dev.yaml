# =============================================================================
# wisepen-user-service（dev profile）
# =============================================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${WISEPEN_MYSQL_HOST:${WISEPEN_INFRA_HOST:localhost}}:${WISEPEN_MYSQL_PORT:3306}/wisepen_user?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${WISEPEN_MYSQL_USER:root}
    password: ${WISEPEN_MYSQL_PASSWORD:root}

  data:
    redis:
      host: ${WISEPEN_REDIS_HOST:${WISEPEN_INFRA_HOST:localhost}}
      port: ${WISEPEN_REDIS_PORT:6379}
      password: ${WISEPEN_REDIS_PASSWORD:root}
      database: 0

springdoc:
  api-docs.enabled: true
  swagger-ui.enabled: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
