server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

ingester:
  max_block_duration: 30m
  trace_idle_period: 30s
  max_block_bytes: 536870912

compactor:
  compaction:
    compaction_window: 1h
    max_block_bytes: 1073741824
    block_retention: 24h
    compacted_block_retention: 1h

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: docker-compose
  storage:
    path: /tmp/tempo/generator/wal
    remote_write:
      # Tempo 算出指标后，推送到 Prometheus 存储
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    local_blocks:
      filter_server_spans: false
      flush_to_storage: true

storage:
  trace:
    backend: local                     # 开发环境存本地磁盘
    block:
      version: vParquet4
    wal:
      path: /tmp/tempo/wal             # Write Ahead Log
    local:
      path: /tmp/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: 
        - local-blocks
        - span-metrics
        - service-graphs
      max_active_series: 20000
      ingestion_time_range_slack: 30s