services:
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: nacos
    restart: always
    environment:
      MODE: standalone
      TZ: ${TZ:-Asia/Shanghai}
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?请填写 NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_IDENTITY_KEY:?请填写 NACOS_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_IDENTITY_VALUE:?请填写 NACOS_IDENTITY_VALUE}
      PREFER_HOST_MODE: hostname
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: "3306"
      MYSQL_SERVICE_DB_NAME: ${NACOS_DB_NAME:-nacos}
      MYSQL_SERVICE_USER: ${NACOS_DB_USERNAME:?请填写 NACOS_DB_USERNAME}
      MYSQL_SERVICE_PASSWORD: ${NACOS_DB_PASSWORD:?请填写 NACOS_DB_PASSWORD}
    ports:
      - "${MIDDLEWARE_BIND_HOST:-127.0.0.1}:${NACOS_HTTP_HOST_PORT:-8848}:8848"
      - "${MIDDLEWARE_BIND_HOST:-127.0.0.1}:${NACOS_GRPC_HOST_PORT:-9848}:9848"
    volumes:
      - ${MIDDLEWARE_DATA_DIR:-../data}/nacos/logs:/home/nacos/logs
      - ${MIDDLEWARE_DATA_DIR:-../data}/nacos/data:/home/nacos/data
    networks:
      - wisepen-net

  etcd:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/bitnami/etcd:3.5
    container_name: etcd
    restart: always
    environment:
      ALLOW_NONE_AUTHENTICATION: "no"
      ETCD_ROOT_PASSWORD: ${ETCD_ROOT_PASSWORD:?请填写 ETCD_ROOT_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
    volumes:
      - ${MIDDLEWARE_DATA_DIR:-../data}/etcd:/bitnami/etcd-data
    networks:
      - wisepen-net

  apisix:
    image: apache/apisix:3.8.0-debian
    container_name: apisix
    restart: always
    depends_on:
      - etcd
      - nacos
    environment:
      ETCD_ROOT_USERNAME: ${ETCD_ROOT_USERNAME:-root}
      ETCD_ROOT_PASSWORD: ${ETCD_ROOT_PASSWORD:?请填写 ETCD_ROOT_PASSWORD}
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?请填写 NACOS_PASSWORD}
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:?请填写 APISIX_ADMIN_KEY}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${PUBLIC_BIND_HOST:-0.0.0.0}:${APISIX_HTTP_HOST_PORT:-80}:9080"
      - "${PUBLIC_BIND_HOST:-0.0.0.0}:${APISIX_HTTPS_HOST_PORT:-443}:9443"
      - "${MIDDLEWARE_BIND_HOST:-127.0.0.1}:${APISIX_ADMIN_HOST_PORT:-9180}:9180"
    volumes:
      - ../conf/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ../conf/apisix/nacos_patched.lua:/usr/local/apisix/apisix/discovery/nacos/init.lua:ro
    networks:
      - wisepen-net

  kafka:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/bitnami/kafka:3.6
    container_name: kafka
    restart: always
    ports:
      - "${MIDDLEWARE_BIND_HOST:-127.0.0.1}:${KAFKA_LOCAL_HOST_PORT:-9092}:9092"
      - "${KAFKA_EXTERNAL_BIND_HOST:-0.0.0.0}:${KAFKA_EXTERNAL_PORT:-9094}:9094"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:?请填写 KAFKA_EXTERNAL_HOST}:${KAFKA_EXTERNAL_PORT:-9094}
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${MIDDLEWARE_DATA_DIR:-../data}/kafka:/bitnami/kafka
    networks:
      - wisepen-net

  jodconverter:
    image: ghcr.io/jodconverter/jodconverter-examples:rest
    container_name: jodconverter
    restart: always
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 100MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 100MB
    ports:
      - "${MIDDLEWARE_BIND_HOST:-127.0.0.1}:${JODCONVERTER_HOST_PORT:-8100}:8080"
    volumes:
      - ${CUSTOM_FONTS_DIR:-../data/fonts}:/usr/share/fonts/custom:ro
    networks:
      - wisepen-net

networks:
  wisepen-net:
    external: true
    name: ${WISEPEN_NETWORK_NAME:-wisepen-net}
